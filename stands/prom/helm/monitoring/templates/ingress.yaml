apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: monitoring-ingress

spec:
  ingressClassName: nginx

  rules:

  - host: grafana.ajax.local

    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: monitoring-grafana
            port:
              number: 80

  - host: prometheus.ajax.local

    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: monitoring-kube-prometheus-prometheus
            port:
              number: 9090