apiVersion: v1
kind: Service

metadata:
  name: web-client
  namespace: "{{ .Values.namespace }}"

  labels:
    app: web-client
    monitoring: enabled

spec:

  selector:
    app: web-client

  ports:
    - name: http
      port: {{ .Values.webClient.service.port }}
      targetPort: {{ .Values.webClient.service.targetPort }}

  type: ClusterIP