loki-stack:

  grafana:
    enabled: false

  prometheus:
    enabled: false

  filebeat:
    enabled: false

  logstash:
    enabled: false

  fluent-bit:
    enabled: false

  loki:
    enabled: true

    persistence:
      enabled: true
      size: 5Gi

  promtail:
    enabled: true

    config:
      clients:
        - url: http://logging-loki:3100/loki/api/v1/push

    serviceMonitor:
      enabled: true