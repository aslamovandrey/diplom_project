---
- name: Полное восстановление apt/dpkg
  hosts: postgres_cluster
  gather_facts: no
  become: yes

  tasks:
    - name: Остановка всех apt процессов
      shell: |
        systemctl stop apt-daily.timer 2>/dev/null || true
        systemctl stop apt-daily-upgrade.timer 2>/dev/null || true
        killall -9 apt apt-get dpkg 2>/dev/null || true
      changed_when: false
      ignore_errors: yes

    - name: Удаление всех lock файлов
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/dpkg/lock-frontend
        - /var/lib/dpkg/lock
        - /var/lib/apt/lists/lock
        - /var/cache/apt/archives/lock
        - /var/lib/apt/extended_states

    - name: Переконфигурация dpkg
      command: dpkg --configure -a
      changed_when: false

    - name: Удаление проблемных кэшей
      command: rm -rf /var/lib/apt/lists/*
      changed_when: false

    - name: Очистка apt
      command: apt clean
      changed_when: false

    - name: Обновление apt
      apt:
        update_cache: yes
        force_apt_get: yes

    - name: Установка базовых пакетов
      apt:
        name:
          - python3
          - python3-pip
        state: present
        force_apt_get: yes