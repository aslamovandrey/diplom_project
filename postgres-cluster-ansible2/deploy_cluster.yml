---
- name: Развертывание Patroni кластера PostgreSQL
  hosts: postgres_cluster
  gather_facts: yes
  vars_files:
    - vault.yml

  tasks:
 # ==================== 0. Очистка блокировок apt/dpkg ====================
    - name: Удаление блокировок apt/dpkg
      become: yes
      block:
        - name: Убить процессы apt/dpkg
          shell: |
            killall apt apt-get dpkg 2>/dev/null || true
          changed_when: false
          ignore_errors: yes

        - name: Удаление lock файлов
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /var/lib/dpkg/lock-frontend
            - /var/lib/dpkg/lock
            - /var/lib/apt/lists/lock
            - /var/cache/apt/archives/lock
            - /var/lib/apt/extended_states
          ignore_errors: yes

        - name: Настройка dpkg
          command: dpkg --configure -a
          changed_when: false
          ignore_errors: yes

        - name: Создание нового extended_states
          copy:
            content: ""
            dest: /var/lib/apt/extended_states
            force: yes
            owner: root
            group: root
            mode: '0644'

    - name: Очистка apt
      become: yes
      command: apt clean
      changed_when: false

    - name: Обновление apt cache
      become: yes
      apt:
        update_cache: yes
        force_apt_get: yes
      changed_when: false

    # ==================== 1. Установка системных пакетов ====================
    - name: Установка системных пакетов
      apt:
        name:
          - acl
          - etcd
          - curl
          - wget
          - gnupg
          - lsb-release
          - software-properties-common
          - python3-pip
          - python3-psycopg2
        update_cache: yes
        cache_valid_time: 3600
        state: present

    # ---------- 3. Установка Patroni и WAL-G ----------
    - name: Установка Patroni через pip
      pip:
        name:
          - patroni[etcd]==3.3.10
          - psycopg2-binary
        state: present
        executable: pip3
      register: patroni_install
      retries: 3
      delay: 5
      until: patroni_install is success

    - name: Установка WAL-G из бинарного файла
      block:
        - name: Определение версии Ubuntu
          set_fact:
            ubuntu_version: "{{ ansible_distribution_version }}"

        - name: Выбор правильной версии WAL-G
          set_fact:
            walg_version: "v3.0.8"
            walg_os: "{{ ubuntu_version }}"

        - name: Скачивание WAL-G
          get_url:
            url: "https://github.com/wal-g/wal-g/releases/download/{{ walg_version }}/wal-g-pg-{{ walg_os }}-amd64.tar.gz"
            #https://github.com/wal-g/wal-g/releases/download/v3.0.8/wal-g-pg-22.04-amd64.tar.gz
            dest: /tmp/wal-g.tar.gz
            mode: '0644'
          register: download_result
          until: download_result is success
          retries: 3
          delay: 5

        - name: Распаковка WAL-G
          unarchive:
            src: /tmp/wal-g.tar.gz
            dest: /tmp/
            remote_src: yes
            creates: /tmp/wal-g-pg-{{ walg_os }}-amd64

        - name: Установка WAL-G в /usr/local/bin
          copy:
            src: "/tmp/wal-g-pg-{{ walg_os }}-amd64"
            dest: /usr/local/bin/wal-g
            mode: '0755'
            remote_src: yes

        - name: Очистка временных файлов
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/wal-g.tar.gz
            - "/tmp/wal-g-pg-{{ walg_os }}-amd64"
      when: backup_enabled | default(true)

    - name: Проверка установки Patroni
      command: patroni --version
      register: patroni_version_check
      changed_when: false

    - name: Проверка установки WAL-G
      command: wal-g --version
      register: walg_version_check
      changed_when: false
      ignore_errors: yes

    - name: Отображение версий
      debug:
        msg:
          - "Patroni: {{ patroni_version_check.stdout }}"
          - "WAL-G: {{ walg_version_check.stdout | default('WAL-G не установлен') }}"

    # ==================== 4. Настройка etcd ====================
    - name: Создание директории etcd
      file:
        path: "{{ etcd_data_dir }}"
        state: directory
        owner: etcd
        group: etcd
        mode: '0750'

    - name: Конфигурация etcd
      template:
        src: templates/etcd.conf.j2
        dest: /etc/default/etcd
        mode: '0644'
      notify: restart etcd

    - name: Запуск etcd
      systemd:
        name: etcd
        state: started
        enabled: yes
        daemon_reload: yes

    # ==================== 5. Настройка Patroni ====================
    - name: Создание директории конфигурации Patroni
      file:
        path: "{{ patroni_config_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: '0750'

    - name: Создание конфигурации Patroni
      template:
        src: templates/patroni.yml.j2
        dest: "{{ patroni_config_dir }}/patroni.yml"
        owner: postgres
        group: postgres
        mode: '0640'
      notify: restart patroni

    - name: Создание systemd сервиса для Patroni
      copy:
        dest: /etc/systemd/system/patroni.service
        content: |
          [Unit]
          Description=Patroni PostgreSQL High Availability Controller
          After=network.target etcd.service
          Wants=etcd.service

          [Service]
          Type=simple
          User=postgres
          Group=postgres
          ExecStart=/usr/local/bin/patroni {{ patroni_config_dir }}/patroni.yml
          KillMode=process
          TimeoutSec=30
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      notify:
        - reload systemd
        - restart patroni

    - name: Запуск Patroni
      systemd:
        name: patroni
        state: started
        enabled: yes

    # ==================== 6. Настройка резервного копирования ====================
    - name: Создание директории для WAL-G конфигурации
      file:
        path: /etc/wal-g
        state: directory
        mode: '0750'
      when: backup_enabled

    - name: Настройка окружения WAL-G
      template:
        src: templates/backup.sh.j2
        dest: /etc/wal-g/backup_env.sh
        mode: '0640'
      when: backup_enabled

    - name: Настройка cron для ежедневного полного бэкапа
      cron:
        name: "PostgreSQL full backup to S3"
        hour: "{{ backup_hour }}"
        minute: "{{ backup_minute }}"
        job: "source /etc/wal-g/backup_env.sh && /usr/local/bin/wal-g backup-push {{ postgresql_data_dir }} >> /var/log/wal-g-backup.log 2>&1"
        state: present
      when: backup_enabled and inventory_hostname == groups['postgres_cluster'][0]

    # ==================== 7. Проверка статуса ====================
    - name: Ожидание готовности Patroni API
      wait_for:
        port: 8008
        host: "{{ node_ip }}"
        delay: 5
        timeout: 120

    - name: Проверка состояния кластера
      uri:
        url: "http://{{ node_ip }}:8008/patroni"
        return_content: yes
      register: patroni_api
      run_once: true

    - name: Отображение статуса кластера
      debug:
        msg: "{{ patroni_api.content | from_json }}"
      run_once: true

  handlers:
    - name: restart etcd
      systemd:
        name: etcd
        state: restarted
        daemon_reload: yes

    - name: restart patroni
      systemd:
        name: patroni
        state: restarted
        daemon_reload: yes

    - name: reload systemd
      systemd:
        daemon_reload: yes