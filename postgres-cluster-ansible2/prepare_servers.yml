---
- name: Подготовка серверов - установка Python и pip
  hosts: postgres_cluster
  gather_facts: no

  tasks:
    - name: Полная очистка блокировок apt/dpkg
      raw: |
        sudo killall apt apt-get dpkg 2>/dev/null || true
        sudo rm -f /var/lib/dpkg/lock-frontend
        sudo rm -f /var/lib/dpkg/lock
        sudo rm -f /var/lib/apt/lists/lock
        sudo rm -f /var/cache/apt/archives/lock
        sudo dpkg --configure -a
      changed_when: false
      ignore_errors: yes

    - name: Удаление поврежденного extended_states
      raw: sudo rm -f /var/lib/apt/extended_states && sudo touch /var/lib/apt/extended_states && sudo chmod 644 /var/lib/apt/extended_states
      changed_when: false
      ignore_errors: yes

    - name: Очистка apt cache
      raw: sudo apt clean && sudo apt autoclean
      changed_when: false
      ignore_errors: yes

    - name: Обновление apt cache
      raw: sudo apt update
      changed_when: false
      register: apt_update

    - name: Установка Python3 и pip3
      raw: sudo DEBIAN_FRONTEND=noninteractive apt install -y python3 python3-pip python3-venv python3-dev
      changed_when: false
      register: python_install

    - name: Обновление pip
      raw: sudo python3 -m pip install --upgrade pip
      changed_when: false

    - name: Установка psycopg2-binary
      raw: sudo python3 -m pip install psycopg2-binary
      changed_when: false

    - name: Проверка установки
      raw: python3 --version && pip3 --version
      register: check_result
      changed_when: false

    - name: Результат проверки
      debug:
        msg: "{{ check_result.stdout_lines }}"

    - name: Сбор фактов о системе
      setup: