all:
  children:
    postgres_cluster:
      hosts:
        pg-node1:
          ansible_host: 93.77.190.192
          node_name: postgres-master
          node_ip: 10.1.0.24
          ansible_user: andrew
        pg-node2:
          ansible_host: 158.160.166.135
          node_name: postgres-replica
          node_ip: 10.2.0.30
          ansible_user: andrew
      vars:
        # Публичные параметры (несекретные)
        cluster_name: main_cluster
        postgresql_version: 16
        patroni_version: 3.4.0
        
        # etcd кластер (публичные данные)
        etcd_initial_cluster: "node1=https://{{ hostvars['pg-node1']['node_ip'] }}:2380,node2=https://{{ hostvars['pg-node2']['node_ip'] }}:2380"
        
        # Параметры бэкапов (публичные)
        backup_enabled: true
        backup_s3_bucket: "my-postgres-backups"
        backup_retention_days: 30
        
        # Путь к инициализирующему скрипту
        init_script_path: "files/init-script.sh"
        
        # Имя vault файла (будет загружен автоматически)
        vault_file: "vault.yml"